[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgm-cmolo"
version = "0.1.0"
description = "CLI-first temporal audio composition research workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
inference = ["torch>=2.4", "torchsde==0.2.6", "diffusers>=0.32,<1", "transformers>=4.44,<5", "accelerate>=1", "sentencepiece", "protobuf"]

[project.scripts]
bgm = "bgm.cli:main"

[tool.setuptools.packages.find]
include = ["bgm*"]
